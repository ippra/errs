# Publish the beta to GitHub Pages.
#
# The worksheet is one static file with no build step, so a push to main
# uploads site/ as it stands. The beta lives at https://ripberjt.github.io/errs/;
# the released version at https://ippra.net/errs is copied there by hand.

name: Publish beta

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
